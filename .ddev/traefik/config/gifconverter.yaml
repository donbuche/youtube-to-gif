http:
  routers:
    gifconverter-web-80-http:
      entrypoints:
        - http-80
      rule: HostRegexp(`^gifconverter\.ddev\.site$`)|| HostRegexp(`^gifconverter\.dev$`)
      
      service: "gifconverter-web-80"
      tls: false
      # middlewares:
      #   - "gifconverter-redirectHttps"
    gifconverter-web-8025-http:
      entrypoints:
        - http-8025
      rule: HostRegexp(`^gifconverter\.ddev\.site$`)|| HostRegexp(`^gifconverter\.dev$`)
      
      service: "gifconverter-web-8025"
      tls: false
      # middlewares:
      #   - "gifconverter-redirectHttps"
    
    
    
    gifconverter-web-80-https:
      entrypoints:
        - http-443
      rule: HostRegexp(`^gifconverter\.ddev\.site$`) || HostRegexp(`^gifconverter\.dev$`)
      
      service: "gifconverter-web-80"
      
      tls: true
      
    gifconverter-web-8025-https:
      entrypoints:
        - http-8026
      rule: HostRegexp(`^gifconverter\.ddev\.site$`) || HostRegexp(`^gifconverter\.dev$`)
      
      service: "gifconverter-web-8025"
      
      tls: true
      
    

  middlewares:
    gifconverter-redirectHttps:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    gifconverter-web-80:
      loadbalancer:
        servers:
          - url: http://ddev-gifconverter-web:80
        
    gifconverter-web-8025:
      loadbalancer:
        servers:
          - url: http://ddev-gifconverter-web:8025
        
    
    
    

tls:
