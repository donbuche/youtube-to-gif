name: youtube-to-gif
type: generic
docroot: public
webserver_type: nginx-fpm
nodejs_version: "20"

additional_hostnames: []
additional_fqdns:
  - youtube-to-gif.dev

# Force /etc/hosts — youtube-to-gif.dev is not a registered domain
use_dns_when_possible: false

# No database needed
omit_containers: [db]

# ffmpeg (video conversion) and yt-dlp (youtube download) are required
# yt-dlp is the maintained fork of youtube-dl
webimage_extra_packages:
  - ffmpeg
  - yt-dlp

# Run the Node.js app as a supervised daemon inside the web container
web_extra_daemons:
  - name: node-server
    command: "bash -c 'cd /var/www/html && npm install --prefer-offline && node server.js'"
    directory: /var/www/html

hooks:
  post-start:
    # Ensure output dir exists inside the container
    - exec: "mkdir -p /var/www/html/output"

web_environment:
  - PORT=3000

php_version: "8.4"
xdebug_enabled: false
composer_version: "2"
corepack_enable: false
